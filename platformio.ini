; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Shared settings for every LLLP build target.
[env]
platform = ststm32
board = fly_buffer_f072c8
framework = arduino
upload_protocol = dfu
lib_deps =
  https://github.com/Fly3DTeam/TMcstepper
build_flags =
  -D USBCON
  -D USBD_USE_CDC
  -D HSE_VALUE=8000000L
  -D USE_HSE
  -D TMC2208_BAUDRATE=9600
board_build.variants_dir = variants
board_build.board_dir = boards

; Back / chained buffers (2-4 units). Token-based feed hand-off.
; Y_JUNCTION_SENSOR enables the shared 4-in-1 Y-junction filament sensor on
; CHAIN_Y_SENSOR_PIN (PB14, a 5V-tolerant FT pin - the 3-5V push-pull sensor
; wires straight in, plain INPUT, no divider). Enable only on units actually
; wired to the shared sensor bus; the pin floats otherwise.
[env:fly_buffer_f072c8]
build_flags =
  ${env.build_flags}
  -D Y_JUNCTION_SENSOR

; Front buffer (single unit, always on, feeds the printhead). Standalone:
; no token gate, filament sensor ignored - it always runs the dancer-arm
; feed loop. Build/flash with: pio run -e fly_buffer_front -t upload
[env:fly_buffer_front]
build_flags =
  ${env.build_flags}
  -D FRONT_BUFFER_STANDALONE

; Debug variants - add SENSOR_DEBUG: streams a throttled live sensor line
; over USB serial (~200ms). Use these for bench/field diagnostics; flash the
; non-debug envs above for production.
[env:fly_buffer_debug]
build_flags =
  ${env:fly_buffer_f072c8.build_flags}
  -D SENSOR_DEBUG

[env:fly_buffer_front_debug]
build_flags =
  ${env:fly_buffer_front.build_flags}
  -D SENSOR_DEBUG
